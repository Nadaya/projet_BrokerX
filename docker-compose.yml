services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file: .env_docker
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - brokerx-net
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5

  account-service:
      build:
        context: .
        dockerfile: ./account-service/Dockerfile
      container_name: account_service
      ports:
        - "8080:8080"
      env_file: .env_docker
      networks:
        - brokerx-net
      depends_on:
        db:
          condition: service_healthy

  portefeuille-service:
    build:
      context: .
      dockerfile: ./portefeuille-service/Dockerfile
    container_name: portefeuille_service
    ports:
      - "8081:8081"
    env_file: .env_docker
    networks:
      - brokerx-net
    depends_on:
      db:
        condition: service_healthy
      account-service:
        condition: service_started


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - brokerx-net
    depends_on:
      - account-service
      - portefeuille-service

  grafana:
    image: grafana/grafana:9.5.0
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    networks:
      - brokerx-net
    depends_on:
      - prometheus

  kafka :
    image : confluentinc/cp-kafka:7.5.0
    hostname : kafka
    container_name : kafka 
    ports : 
      - "9092:9092"
      - "9101:9101"
    environnement : 
      CLUSTER_ID: "qwertyuiopasdfghjkl"   # n’importe quel ID généré une fois
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
    networks : 
      - brokerx-net


volumes:
  db_data:
  prometheus_data:
  grafana_data:

networks:
  brokerx-net: